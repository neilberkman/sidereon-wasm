name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Callable so the release workflow gates on this exact bar rather than a
  # weaker copy of it. Two lists drift, and the weaker one ends up guarding
  # the irreversible action.
  workflow_call:

permissions:
  contents: read

jobs:
  # A workflow file can be valid YAML and still be a broken workflow - a
  # branch filter on workflow_call parses fine and then fails the run in 0s
  # with no useful message. Lint the workflows themselves.
  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The pinned upstream binary, not a wrapper action: a wrapper resolves
      # its own Node dependencies out of this repository's root node_modules
      # and dies before it lints anything. Running the same binary the same way
      # locally and in CI is the point.
      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          curl -sSfL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o actionlint.tar.gz
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -shellcheck= -pyflakes=

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      # shared-key so the tag-triggered release gate reuses push CI's cache.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.15.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install
        run: npm ci

      - name: Build (web + node targets)
        run: npm run build

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Check npm package
        run: npm run check:package

      - name: Lint
        run: npm run lint

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run structured core-error mapper tests
        run: |
          cargo test --locked --lib core_error::tests
          test_log="$(mktemp)"
          trap 'rm -f "$test_log"' EXIT
          cargo test --locked --lib positioning_error::rinex_spp_detail_tests::observation_parse_error_keeps_complete_nested_detail_and_messages -- --exact | tee "$test_log"
          grep -Fq 'test positioning_error::rinex_spp_detail_tests::observation_parse_error_keeps_complete_nested_detail_and_messages ... ok' "$test_log"
          grep -Fq '1 passed; 0 failed' "$test_log"

      - name: Format
        run: cargo fmt --check
