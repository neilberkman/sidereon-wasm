name: generate-core-goldens

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-golden-generator

      - name: Verify published core source
        run: npm run check:core

      - name: Generate golden fixture
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --release \
            --manifest-path test/golden-gen/Cargo.toml \
            > "$RUNNER_TEMP/core_goldens.json"

      - uses: actions/upload-artifact@v4
        with:
          name: core-goldens-4.0.0
          path: |
            ${{ runner.temp }}/core_goldens.json
            test/golden-gen/Cargo.toml
            test/golden-gen/Cargo.lock
          if-no-files-found: error
